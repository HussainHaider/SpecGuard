# db, qdrant and redis are the backing services; api, worker, web and n8n sit behind
# the `app` profile, so `docker compose up` starts the datastores and nothing else.
# Bring the whole thing up with `docker compose --profile app up`.
#
# Production overrides live in deploy/docker-compose.prod.yml — basic auth at Caddy,
# resource limits, and no published database, vector store or n8n ports.

name: specguard

services:
  db:
    # pgvector's own image rather than plain postgres:16 — same server, same data
    # directory, with the extension available. PgVectorStore exists so Qdrant can be
    # compared against it (evals/benchmark_retrieval.py); nothing in the application
    # path reads from it.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-specguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-specguard}
      POSTGRES_DB: ${POSTGRES_DB:-specguard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-specguard} -d ${POSTGRES_DB:-specguard}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"   # REST + dashboard at /dashboard
      - "${QDRANT_GRPC_PORT:-6334}:6334"   # gRPC, used by qdrant-client
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    healthcheck:
      # The image has no curl or wget; its own binary can answer the readiness probe.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    profiles: ["app"]
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-specguard}:${POSTGRES_PASSWORD:-specguard}@db:5432/${POSTGRES_DB:-specguard}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      # Absolute, because the package lives at /app/src/specguard in the image and
      # deriving a repository root from __file__ lands on / in a container.
      CORPUS_DIR: /app/corpus
      FIXTURES_DIR: /app/fixtures
      # Declared here as well as in .env so it can be flipped for one run:
      #   DEMO_MODE=true docker compose --profile app up -d api
      # An `environment:` entry wins over `env_file:`, which is what makes the override
      # take effect at all.
      DEMO_MODE: ${DEMO_MODE:-false}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./corpus:/app/corpus:ro
      - ./fixtures:/app/fixtures:ro
      # The API writes the upload; the worker reads it. Two containers, so this has to
      # be a shared volume — on a container-local /tmp the worker looks for a file that
      # only ever existed in the API's filesystem.
      - uploads:/tmp/specguard-uploads
      - fastembed_cache:/app/.cache/fastembed
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
      # The API enqueues on submit. Without Redis it still serves stored reports and
      # says so at /healthz, but nothing new can be queued.
      redis:
        condition: service_healthy

  worker:
    profiles: ["app"]
    # Same image as the api; it takes jobs off Redis and runs the check graph.
    # See docs/decisions.md 013 — arq supersedes the Postgres job queue.
    build:
      context: ./api
      dockerfile: Dockerfile
    # arq is the runner. `python -m specguard.worker` imported the module and exited,
    # so the container stayed up and every job stayed queued.
    command: ["arq", "specguard.worker.WorkerSettings"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-specguard}:${POSTGRES_PASSWORD:-specguard}@db:5432/${POSTGRES_DB:-specguard}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      # Absolute, because the package lives at /app/src/specguard in the image and
      # deriving a repository root from __file__ lands on / in a container.
      CORPUS_DIR: /app/corpus
      FIXTURES_DIR: /app/fixtures
    volumes:
      - ./corpus:/app/corpus:ro
      - ./fixtures:/app/fixtures:ro
      - uploads:/tmp/specguard-uploads
      - fastembed_cache:/app/.cache/fastembed
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy

  web:
    profiles: ["app"]
    build:
      context: ./web
      dockerfile: Dockerfile
      # Vite inlines these at build time, so they are build args rather than runtime
      # environment. Changing the API host means rebuilding the image.
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_LANGSMITH_URL: ${VITE_LANGSMITH_URL:-https://smith.langchain.com}
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - api

  # Community edition, self-hosted from this file. No cloud account, no licence key.
  # First start asks you to create a local owner account — that is expected and the
  # account never leaves this machine.
  n8n:
    profiles: ["app"]
    image: n8nio/n8n:1.70.1
    environment:
      # Explicit, and the single most important line in this service. n8n encrypts
      # saved credentials with this key. Left unset it generates one into the volume on
      # first start, so a volume reset — or a fresh clone — silently orphans every
      # credential that was saved under the old key, with no way to recover them.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      # Schedule triggers fire in this zone. Unset, the weekly regulation watcher runs
      # at an hour nobody chose.
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Berlin}
      TZ: ${GENERIC_TIMEZONE:-Europe/Berlin}
      N8N_HOST: ${N8N_HOST:-localhost}
      # What n8n prints as a node's callback address. Wrong here means a webhook URL
      # that looks right in the editor and resolves to nothing.
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_PORT: 5678
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      # Workflows are exported to n8n/ as JSON and committed; this is the path both
      # `just n8n-export` and `just n8n-import` address.
      N8N_USER_FOLDER: /home/node/.n8n
    ports:
      # Published for local development only. The production override drops this: n8n
      # holds credentials and has no business on a public interface, and it is reached
      # over an SSH tunnel instead (docs/deployment.md).
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      # Bind-mounted rather than a volume: these files are committed to the repository,
      # so an export lands in the working tree where it can be reviewed and a clean
      # clone already has the workflows to import.
      - ./n8n:/workflows
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data:
  qdrant_data:
  n8n_data:
  uploads:
  fastembed_cache:
